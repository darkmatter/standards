name: Story coverage action
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: arc
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix actions/story-coverage
      - run: node --test actions/story-coverage/*.test.mjs
